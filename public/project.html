<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project - TaskFlow</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --primary:#4f46e5;
    --primary2:#6366f1;
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#718096;
    --border:#e7ebf3;
    --success:#10b981;
    --warning:#f59e0b;
    --danger:#ef4444;
    --shadow:0 12px 35px rgba(15,23,42,.07);
    --radius:18px;
}

body{
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:.25s;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* ================= NAVBAR ================= */

.navbar{
    height:72px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    position:sticky;
    top:0;
    z-index:100;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:11px;
}

.logo-box{
    width:40px;
    height:40px;
    border-radius:12px;
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary2)
    );
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:800;
    box-shadow:0 8px 18px rgba(79,70,229,.2);
}

.logo{
    font-size:21px;
    font-weight:800;
    letter-spacing:-.5px;
}

.logo span{
    color:var(--primary);
}

.nav-right{
    display:flex;
    align-items:center;
    gap:9px;
}

.nav-btn{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    padding:9px 13px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    transition:.2s;
}

.nav-btn:hover{
    border-color:var(--primary);
    color:var(--primary);
    transform:translateY(-1px);
}

.color-wrap{
    position:relative;
}

.color-btn{
    display:flex;
    align-items:center;
    gap:7px;
}

.color-dot{
    width:16px;
    height:16px;
    border-radius:50%;
    background:var(--primary);
    border:2px solid white;
    box-shadow:0 0 0 1px var(--border);
}

.color-panel{
    display:none;
    position:absolute;
    right:0;
    top:48px;
    width:240px;
    padding:18px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 18px 45px rgba(0,0,0,.15);
    z-index:300;
}

.color-panel.show{
    display:block;
}

.color-panel h4{
    font-size:14px;
    margin-bottom:12px;
}

.color-panel input[type="color"]{
    width:100%;
    height:45px;
    border:none;
    background:none;
    cursor:pointer;
}

.color-options{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-top:12px;
}

.color-option{
    width:28px;
    height:28px;
    border-radius:50%;
    border:2px solid white;
    outline:1px solid #cbd5e1;
    cursor:pointer;
}

/* ================= CONTAINER ================= */

.container{
    width:92%;
    max-width:1250px;
    margin:30px auto 60px;
}

/* ================= PROJECT HERO ================= */

.project-header{
    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary2)
        );
    color:white;
    border-radius:23px;
    padding:32px;
    margin-bottom:22px;
    box-shadow:0 18px 40px rgba(79,70,229,.18);
    position:relative;
    overflow:hidden;
}

.project-header::after{
    content:"";
    position:absolute;
    width:240px;
    height:240px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    right:-70px;
    top:-100px;
}

.project-header::before{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    border-radius:50%;
    background:rgba(255,255,255,.06);
    left:-60px;
    bottom:-80px;
}

.project-content{
    position:relative;
    z-index:2;
}

.project-header-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
}

.project-label{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:6px 10px;
    border-radius:20px;
    background:rgba(255,255,255,.14);
    font-size:11px;
    font-weight:700;
    margin-bottom:12px;
}

.project-header h1{
    font-size:34px;
    letter-spacing:-1px;
    margin-bottom:9px;
    word-break:break-word;
}

.project-description{
    opacity:.9;
    line-height:1.65;
    max-width:820px;
    font-size:14px;
}

.project-date{
    margin-top:14px;
    font-size:12px;
    opacity:.78;
}

.project-status-box{
    min-width:120px;
    text-align:center;
    padding:15px;
    border-radius:15px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(8px);
}

.project-status-box strong{
    display:block;
    font-size:25px;
}

.project-status-box span{
    font-size:11px;
    opacity:.8;
}

.progress-wrap{
    margin-top:27px;
}

.progress-info{
    display:flex;
    justify-content:space-between;
    margin-bottom:9px;
    font-size:13px;
}

.progress-bar{
    width:100%;
    height:10px;
    background:rgba(255,255,255,.23);
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0;
    background:white;
    border-radius:20px;
    transition:.45s;
}

/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:22px;
}

.stat-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:17px;
    padding:20px;
    box-shadow:var(--shadow);
    transition:.2s;
}

.stat-card:hover{
    transform:translateY(-3px);
}

.stat-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.stat-icon{
    width:39px;
    height:39px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(79,70,229,.09);
}

.stat-number{
    font-size:28px;
    font-weight:800;
    margin-top:13px;
}

.stat-label{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

/* ================= TASK SECTION ================= */

.tasks-section{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:25px;
    box-shadow:var(--shadow);
}

.section-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.section-heading{
    display:flex;
    align-items:center;
    gap:11px;
}

.section-heading-icon{
    width:40px;
    height:40px;
    border-radius:11px;
    background:rgba(79,70,229,.09);
    display:flex;
    align-items:center;
    justify-content:center;
}

.section-top h2{
    font-size:21px;
    letter-spacing:-.4px;
}

.section-subtitle{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

/* ================= FILTERS ================= */

.filters{
    display:grid;
    grid-template-columns:1fr 180px 180px;
    gap:10px;
    margin-bottom:22px;
}

.filter-input,
.filters select{
    width:100%;
    padding:11px 13px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    outline:none;
    font-size:13px;
}

.filter-input:focus,
.filters select:focus{
    border-color:var(--primary);
}

/* ================= BUTTONS ================= */

.btn{
    border:none;
    border-radius:10px;
    padding:10px 15px;
    cursor:pointer;
    font-weight:700;
    font-size:12px;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.primary{
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary2)
    );
    color:white;
    box-shadow:0 7px 16px rgba(79,70,229,.17);
}

.edit-btn{
    background:rgba(37,99,235,.09);
    color:#2563eb;
}

.delete-btn{
    background:rgba(239,68,68,.09);
    color:#dc2626;
}

.edit-btn:hover{
    background:#2563eb;
    color:white;
}

.delete-btn:hover{
    background:#dc2626;
    color:white;
}

/* ================= TASK CARD ================= */

.task-card{
    border:1px solid var(--border);
    border-radius:17px;
    padding:20px;
    margin-bottom:15px;
    background:var(--card);
    transition:.22s;
}

.task-card:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 30px rgba(15,23,42,.07);
}

.task-top{
    display:flex;
    justify-content:space-between;
    gap:20px;
}

.task-main{
    flex:1;
    min-width:0;
}

.task-name{
    font-size:17px;
    font-weight:800;
    margin-bottom:7px;
    word-break:break-word;
}

.task-description{
    color:var(--muted);
    line-height:1.55;
    font-size:13px;
    margin-bottom:12px;
}

.task-actions{
    display:flex;
    gap:7px;
    align-items:flex-start;
}

/* ================= BADGES ================= */

.badges{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:6px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:750;
}

.status-todo{
    background:#eef2ff;
    color:#4338ca;
}

.status-progress{
    background:#fff7ed;
    color:#ea580c;
}

.status-completed{
    background:#ecfdf5;
    color:#059669;
}

.priority-high{
    background:#fee2e2;
    color:#dc2626;
}

.priority-medium{
    background:#fef3c7;
    color:#b45309;
}

.priority-low{
    background:#dcfce7;
    color:#15803d;
}

.due-date{
    background:#f1f5f9;
    color:#475569;
}

.overdue{
    background:#7f1d1d;
    color:white;
}

.assigned{
    background:#ede9fe;
    color:#6d28d9;
}

/* ================= COMMENTS ================= */

.comments{
    border-top:1px solid var(--border);
    margin-top:18px;
    padding-top:17px;
}

.comments-title{
    font-size:13px;
    font-weight:800;
    margin-bottom:12px;
}

.comment-form{
    display:flex;
    gap:8px;
    margin-bottom:13px;
}

.comment-input{
    flex:1;
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px;
    outline:none;
    background:var(--card);
    color:var(--text);
    font-size:13px;
}

.comment-input:focus{
    border-color:var(--primary);
}

.comment{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:11px;
    padding:11px 12px;
    margin-bottom:8px;
}

.comment-header{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:5px;
}

.comment-user{
    font-weight:800;
    font-size:12px;
}

.comment-date{
    color:#94a3b8;
    font-size:10px;
}

.comment-text{
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
}

.comment-delete{
    border:none;
    background:none;
    color:var(--danger);
    cursor:pointer;
    font-size:11px;
    margin-top:7px;
    font-weight:700;
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    padding:50px 15px;
    color:var(--muted);
}

.empty-icon{
    width:58px;
    height:58px;
    border-radius:17px;
    background:rgba(79,70,229,.08);
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 13px;
    font-size:25px;
}

.empty h3{
    color:var(--text);
    margin-bottom:5px;
    font-size:16px;
}

.empty p{
    font-size:12px;
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.62);
    backdrop-filter:blur(5px);
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:500;
}

.modal-box{
    width:100%;
    max-width:570px;
    max-height:90vh;
    overflow-y:auto;
    background:var(--card);
    color:var(--text);
    border-radius:20px;
    padding:26px;
    box-shadow:0 25px 70px rgba(0,0,0,.25);
    animation:modalIn .2s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.modal-header h2{
    font-size:20px;
}

.close-btn{
    width:34px;
    height:34px;
    border:0;
    background:var(--bg);
    color:var(--muted);
    border-radius:9px;
    font-size:20px;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-weight:750;
    margin-bottom:7px;
    font-size:12px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:11px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
    background:var(--card);
    color:var(--text);
    font-size:13px;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:var(--primary);
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.modal-buttons{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:18px;
}

.cancel{
    background:#e5e7eb;
    color:#374151;
}

body.dark .cancel{
    background:#334155;
    color:white;
}

/* ================= DARK MODE ================= */

body.dark{
    --bg:#0f172a;
    --card:#172033;
    --text:#f8fafc;
    --muted:#a8b3c5;
    --border:#2b3950;
    --shadow:0 12px 35px rgba(0,0,0,.25);
}

body.dark .filter-input,
body.dark .filters select,
body.dark .form-group input,
body.dark .form-group textarea,
body.dark .form-group select{
    background:#111827;
}

body.dark .due-date{
    background:#263244;
    color:#cbd5e1;
}

body.dark .comment{
    background:#111827;
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .filters{
        grid-template-columns:1fr;
    }

    .project-status-box{
        display:none;
    }
}

@media(max-width:650px){

    .navbar{
        height:auto;
        min-height:65px;
        padding:12px 4%;
    }

    .logo{
        font-size:18px;
    }

    .logo-box{
        width:36px;
        height:36px;
    }

    .nav-right{
        gap:5px;
    }

    .nav-btn{
        padding:8px 9px;
        font-size:11px;
    }

    .color-btn{
        font-size:0;
    }

    .color-btn .color-dot{
        margin:0;
    }

    .container{
        width:94%;
        margin-top:20px;
    }

    .project-header{
        padding:23px;
        border-radius:19px;
    }

    .project-header h1{
        font-size:26px;
    }

    .project-description{
        font-size:13px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .stat-card{
        padding:15px;
    }

    .stat-number{
        font-size:23px;
    }

    .tasks-section{
        padding:17px;
    }

    .section-top{
        flex-direction:column;
        align-items:stretch;
    }

    .section-top .btn{
        width:100%;
    }

    .task-top{
        flex-direction:column;
    }

    .task-actions{
        width:100%;
    }

    .task-actions .btn{
        flex:1;
    }

    .form-row{
        grid-template-columns:1fr;
    }

    .comment-form{
        flex-direction:column;
    }

    .comment-form .btn{
        width:100%;
    }

    .color-panel{
        right:-45px;
    }
}

@media(max-width:420px){

    .logo{
        display:none;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .project-header{
        padding:20px;
    }

    .tasks-section{
        padding:14px;
    }

    .modal-box{
        padding:20px;
    }
}
</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo-area">

        <div class="logo-box">
            T
        </div>

        <div class="logo">
            Task<span>Flow</span>
        </div>

    </div>


    <div class="nav-right">

        <button
            class="nav-btn"
            onclick="goDashboard()">
            ← Dashboard
        </button>


        <div class="color-wrap">

            <button
                class="nav-btn color-btn"
                id="colorBtn">

                <span
                    class="color-dot"
                    id="colorDot">
                </span>

                🎨 Color

            </button>


            <div
                class="color-panel"
                id="colorPanel">

                <h4>
                    Choose Theme Color
                </h4>

                <input
                    type="color"
                    id="colorPicker"
                    value="#4f46e5">

                <div class="color-options">

                    <button
                        class="color-option"
                        style="background:#4f46e5"
                        data-color="#4f46e5">
                    </button>

                    <button
                        class="color-option"
                        style="background:#2563eb"
                        data-color="#2563eb">
                    </button>

                    <button
                        class="color-option"
                        style="background:#06b6d4"
                        data-color="#06b6d4">
                    </button>

                    <button
                        class="color-option"
                        style="background:#10b981"
                        data-color="#10b981">
                    </button>

                    <button
                        class="color-option"
                        style="background:#f59e0b"
                        data-color="#f59e0b">
                    </button>

                    <button
                        class="color-option"
                        style="background:#f43f5e"
                        data-color="#f43f5e">
                    </button>

                    <button
                        class="color-option"
                        style="background:#ec4899"
                        data-color="#ec4899">
                    </button>

                    <button
                        class="color-option"
                        style="background:#8b5cf6"
                        data-color="#8b5cf6">
                    </button>

                </div>

            </div>

        </div>


        <button
            class="nav-btn"
            onclick="toggleTheme()"
            id="themeBtn">
            🌙
        </button>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<main class="container">


    <!-- PROJECT HEADER -->

    <section class="project-header">

        <div class="project-content">

            <div class="project-header-top">

                <div>

                    <div class="project-label">
                        📁 Project Workspace
                    </div>

                    <h1 id="projectName">
                        Loading...
                    </h1>

                    <p
                        class="project-description"
                        id="projectDescription">
                        Loading project...
                    </p>

                    <div
                        class="project-date"
                        id="projectDate">
                    </div>

                </div>


                <div class="project-status-box">

                    <strong id="heroPercent">
                        0%
                    </strong>

                    <span>
                        Completed
                    </span>

                </div>

            </div>


            <div class="progress-wrap">

                <div class="progress-info">

                    <span>
                        Project Progress
                    </span>

                    <strong id="progressText">
                        0%
                    </strong>

                </div>


                <div class="progress-bar">

                    <div
                        class="progress-fill"
                        id="progressFill">
                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- ================= STATS ================= -->

    <section class="stats">


        <div class="stat-card">

            <div class="stat-top">

                <div>
                    <div
                        class="stat-number"
                        id="totalTasks">
                        0
                    </div>

                    <div class="stat-label">
                        Total Tasks
                    </div>
                </div>

                <div class="stat-icon">
                    📋
                </div>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-top">

                <div>
                    <div
                        class="stat-number"
                        id="todoTasks">
                        0
                    </div>

                    <div class="stat-label">
                        To Do
                    </div>
                </div>

                <div class="stat-icon">
                    📝
                </div>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-top">

                <div>
                    <div
                        class="stat-number"
                        id="progressTasks">
                        0
                    </div>

                    <div class="stat-label">
                        In Progress
                    </div>
                </div>

<script>

/* =========================================================
   AUTH
========================================================= */

const token =
    localStorage.getItem("token");

const userData =
    localStorage.getItem("user");

if(!token || !userData){

    window.location.replace(
        "login.html"
    );

}


let user = null;

try{

    user =
        JSON.parse(userData);

}catch(error){

    localStorage.removeItem("token");
    localStorage.removeItem("user");

    window.location.replace(
        "login.html"
    );

}


/* =========================================================
   PROJECT
========================================================= */

const projectId =
    localStorage.getItem(
        "selectedProjectId"
    );


if(!projectId){

    window.location.replace(
        "dashboard.html"
    );

}


let database = null;
let currentProject = null;
let editingTaskId = null;


/* =========================================================
   COLOR THEME
========================================================= */

function hexToRgb(hex){

    hex =
        hex.replace("#","");

    return {

        r:parseInt(
            hex.substring(0,2),
            16
        ),

        g:parseInt(
            hex.substring(2,4),
            16
        ),

        b:parseInt(
            hex.substring(4,6),
            16
        )

    };

}


function applyThemeColor(color){

    if(
        !/^#[0-9A-F]{6}$/i.test(color)
    ){
        return;
    }


    const rgb =
        hexToRgb(color);


    document.documentElement
        .style
        .setProperty(
            "--primary",
            color
        );


    const second =
        `rgb(
            ${Math.min(255,rgb.r + 45)},
            ${Math.min(255,rgb.g + 35)},
            ${Math.min(255,rgb.b + 35)}
        )`;


    document.documentElement
        .style
        .setProperty(
            "--primary2",
            second
        );


    localStorage.setItem(
        "taskflowColor",
        color
    );


    document.getElementById(
        "colorPicker"
    ).value = color;


    document.getElementById(
        "colorDot"
    ).style.background = color;

}


function loadColor(){

    const saved =
        localStorage.getItem(
            "taskflowColor"
        ) || "#4f46e5";

    applyThemeColor(saved);

}


document
    .getElementById("colorBtn")
    .addEventListener(
        "click",
        function(event){

            event.stopPropagation();

            document
                .getElementById("colorPanel")
                .classList
                .toggle("show");

        }
    );


document
    .getElementById("colorPicker")
    .addEventListener(
        "input",
        function(){

            applyThemeColor(
                this.value
            );

        }
    );


document
    .querySelectorAll(".color-option")
    .forEach(button => {

        button.addEventListener(
            "click",
            function(){

                applyThemeColor(
                    this.dataset.color
                );

            }
        );

    });


document.addEventListener(
    "click",
    function(event){

        const panel =
            document.getElementById(
                "colorPanel"
            );

        const button =
            document.getElementById(
                "colorBtn"
            );

        if(
            !panel.contains(event.target) &&
            event.target !== button
        ){

            panel.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

    if(!value){
        return "";
    }

    return new Date(
        value
    ).toLocaleString();

}


function formatDueDate(value){

    if(!value){
        return "No due date";
    }

    return new Date(
        value
    ).toLocaleDateString();

}


function isOverdue(task){

    if(!task.dueDate){
        return false;
    }

    if(
        String(task.status).toLowerCase()
        === "completed"
    ){
        return false;
    }

    return (
        new Date(task.dueDate) <
        new Date()
    );

}


/* =========================================================
   DASHBOARD
========================================================= */

function goDashboard(){

    window.location.href =
        "dashboard.html";

}


/* =========================================================
   DARK MODE
========================================================= */

function toggleTheme(){

    document.body
        .classList
        .toggle("dark");


    const dark =
        document.body
            .classList
            .contains("dark");


    localStorage.setItem(
        "taskflowTheme",
        dark ? "dark" : "light"
    );


    document.getElementById(
        "themeBtn"
    ).textContent =
        dark ? "☀️" : "🌙";

}


function loadTheme(){

    const theme =
        localStorage.getItem(
            "taskflowTheme"
        );


    if(theme === "dark"){

        document.body
            .classList
            .add("dark");


        document.getElementById(
            "themeBtn"
        ).textContent = "☀️";

    }

}


/* =========================================================
   LOAD PROJECT
========================================================= */

async function loadProject(){

    try{

        const response =
            await fetch(
                "/api/database"
            );


        if(!response.ok){

            throw new Error(
                "Database request failed"
            );

        }


        database =
            await response.json();


        currentProject =
            (database.projects || [])
            .find(
                project =>
                    String(project.id) ===
                    String(projectId)
            );


        if(!currentProject){

            alert(
                "Project not found."
            );

            window.location.href =
                "dashboard.html";

            return;

        }


        document.getElementById(
            "projectName"
        ).textContent =
            currentProject.name ||
            "Untitled Project";


        document.getElementById(
            "projectDescription"
        ).textContent =
            currentProject.description ||
            "No project description.";


        document.getElementById(
            "projectDate"
        ).textContent =
            currentProject.createdAt
                ? "Created: " +
                  new Date(
                      currentProject.createdAt
                  ).toLocaleDateString()
                : "";


        updateStats();

        renderTasks();


    }catch(error){

        console.error(error);

        document.getElementById(
            "tasksContainer"
        ).innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h3>
                    Unable to load project
                </h3>

                <p>
                    Make sure the server is running.
                </p>

            </div>

        `;

    }

}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    const tasks =
        (database.tasks || [])
        .filter(
            task =>
                String(task.projectId) ===
                String(projectId)
        );


    const total =
        tasks.length;


    const todo =
        tasks.filter(
            task =>
                String(task.status)
                .toLowerCase() === "todo"
        ).length;


    const progress =
        tasks.filter(
            task =>
                String(task.status)
                .toLowerCase() ===
                "in-progress"
        ).length;


    const completed =
        tasks.filter(
            task =>
                String(task.status)
                .toLowerCase() ===
                "completed"
        ).length;


    document.getElementById(
        "totalTasks"
    ).textContent = total;


    document.getElementById(
        "todoTasks"
    ).textContent = todo;


    document.getElementById(
        "progressTasks"
    ).textContent = progress;


    document.getElementById(
        "completedTasks"
    ).textContent = completed;


    const percentage =
        total === 0
            ? 0
            : Math.round(
                completed /
                total *
                100
            );


    document.getElementById(
        "progressText"
    ).textContent =
        percentage + "%";


    document.getElementById(
        "heroPercent"
    ).textContent =
        percentage + "%";


    document.getElementById(
        "progressFill"
    ).style.width =
        percentage + "%";

}


/* =========================================================
   RENDER TASKS
========================================================= */

function renderTasks(){

    if(!database){
        return;
    }


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    const priority =
        document.getElementById(
            "priorityFilter"
        ).value;


    let tasks =
        (database.tasks || [])
        .filter(
            task =>
                String(task.projectId) ===
                String(projectId)
        );


    tasks =
        tasks.filter(task => {

            const name =
                String(
                    task.name || ""
                ).toLowerCase();


            const description =
                String(
                    task.description || ""
                ).toLowerCase();


            const matchesSearch =
                !search ||
                name.includes(search) ||
                description.includes(search);


            const matchesStatus =
                status === "all" ||
                String(task.status)
                    .toLowerCase() ===
                    status;


            const matchesPriority =
                priority === "all" ||
                String(
                    task.priority || "medium"
                ).toLowerCase() ===
                priority;


            return (
                matchesSearch &&
                matchesStatus &&
                matchesPriority
            );

        });


    const container =
        document.getElementById(
            "tasksContainer"
        );


    if(tasks.length === 0){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📋
                </div>

                <h3>
                    No matching tasks
                </h3>

                <p>
                    Try another search or create a new task.
                </p>

            </div>

        `;

        return;

    }


    const comments =
        Array.isArray(database.comments)
            ? database.comments
            : [];


    container.innerHTML =
        tasks
            .map(
                task =>
                    createTaskHTML(
                        task,
                        comments
                    )
            )
            .join("");

}


/* =========================================================
   TASK HTML
========================================================= */

function createTaskHTML(
    task,
    comments
){

    const taskComments =
        comments.filter(
            comment =>
                String(comment.taskId) ===
                String(task.id)
        );


    let statusText = "To Do";
    let statusClass = "status-todo";


    if(
        String(task.status)
        .toLowerCase() ===
        "in-progress"
    ){

        statusText =
            "In Progress";

        statusClass =
            "status-progress";

    }


    if(
        String(task.status)
        .toLowerCase() ===
        "completed"
    ){

        statusText =
            "Completed";

        statusClass =
            "status-completed";

    }


    const priority =
        String(
            task.priority || "medium"
        ).toLowerCase();


    const overdue =
        isOverdue(task);


    const safeTaskId =
        String(task.id)
        .replace(/'/g,"\\'");


    return `

        <div class="task-card">

            <div class="task-top">

                <div class="task-main">

                    <div class="task-name">

                        ${escapeHTML(
                            task.name ||
                            "Untitled Task"
                        )}

                    </div>


                    <div class="task-description">

                        ${escapeHTML(
                            task.description ||
                            "No description added."
                        )}

                    </div>


                    <div class="badges">

                        <span
                            class="badge ${statusClass}">
                            ${statusText}
                        </span>


                        <span
                            class="badge priority-${priority}">

                            ${escapeHTML(
                                priority
                                    .charAt(0)
                                    .toUpperCase() +
                                priority.slice(1)
                            )}
                            Priority

                        </span>


                        ${
                            task.dueDate
                                ? `

                                    <span
                                        class="badge ${
                                            overdue
                                                ? "overdue"
                                                : "due-date"
                                        }">

                                        ${
                                            overdue
                                                ? "⚠ Overdue: "
                                                : "📅 Due: "
                                        }

                                        ${escapeHTML(
                                            formatDueDate(
                                                task.dueDate
                                            )
                                        )}

                                    </span>

                                  `
                                : ""
                        }


                        ${
                            task.assignedTo
                                ? `

                                    <span
                                        class="badge assigned">

                                        👤
                                        ${escapeHTML(
                                            task.assignedTo
                                        )}

                                    </span>

                                  `
                                : ""
                        }

                    </div>

                </div>


                <div class="task-actions">

                    <button
                        class="btn edit-btn"
                        onclick="openEditModal('${safeTaskId}')">

                        ✏ Edit

                    </button>


                    <button
                        class="btn delete-btn"
                        onclick="deleteTask('${safeTaskId}')">

                        🗑 Delete

                    </button>

                </div>

            </div>


            <div class="comments">

                <div class="comments-title">
                    💬 Comments
                </div>


                <div class="comment-form">

                    <input
                        type="text"
                        class="comment-input"
                        id="comment-${escapeHTML(task.id)}"
                        placeholder="Write a comment...">


                    <button
                        class="btn primary"
                        onclick="addComment('${safeTaskId}')">

                        Add Comment

                    </button>

                </div>


                ${
                    taskComments.length === 0
                        ? `

                            <div
                                class="empty"
                                style="padding:12px">

                                No comments yet.

                            </div>

                          `
                        :
                          taskComments
                            .map(
                                comment =>
                                    createCommentHTML(
                                        comment
                                    )
                            )
                            .join("")
                }

            </div>

        </div>

    `;

}


/* =========================================================
   COMMENTS HTML
========================================================= */

function createCommentHTML(
    comment
){

    const canDelete =
        String(
            comment.userId
        ) ===
        String(user.id);


    const safeId =
        String(comment.id)
        .replace(/'/g,"\\'");


    return `

        <div class="comment">

            <div class="comment-header">

                <span class="comment-user">

                    ${escapeHTML(
                        comment.userName ||
                        "User"
                    )}

                </span>


                <span class="comment-date">

                    ${formatDate(
                        comment.createdAt
                    )}

                </span>

            </div>


            <div class="comment-text">

                ${escapeHTML(
                    comment.text
                )}

            </div>


            ${
                canDelete
                    ? `

                        <button
                            class="comment-delete"
                            onclick="deleteComment('${safeId}')">

                            Delete comment

                        </button>

                      `
                    : ""
            }

        </div>

    `;

}


/* =========================================================
   CREATE TASK MODAL
========================================================= */

function openCreateModal(){

    editingTaskId = null;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Create Task";


    document.getElementById(
        "taskName"
    ).value = "";


    document.getElementById(
        "taskDescription"
    ).value = "";


    document.getElementById(
        "taskStatus"
    ).value =
        "todo";


    document.getElementById(
        "taskPriority"
    ).value =
        "medium";


    document.getElementById(
        "taskDueDate"
    ).value = "";


    document.getElementById(
        "taskAssignedTo"
    ).value = "";


    document.getElementById(
        "taskModal"
    ).style.display =
        "flex";


    setTimeout(
        () => {

            document
                .getElementById(
                    "taskName"
                )
                .focus();

        },
        100
    );

}


/* =========================================================
   EDIT TASK
========================================================= */

function openEditModal(
    taskId
){

    const task =
        (database.tasks || [])
        .find(
            item =>
                String(item.id) ===
                String(taskId)
        );


    if(!task){

        alert(
            "Task not found."
        );

        return;

    }


    editingTaskId =
        taskId;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Task";


    document.getElementById(
        "taskName"
    ).value =
        task.name || "";


    document.getElementById(
        "taskDescription"
    ).value =
        task.description || "";


    document.getElementById(
        "taskStatus"
    ).value =
        task.status || "todo";


    document.getElementById(
        "taskPriority"
    ).value =
        task.priority || "medium";


    document.getElementById(
        "taskDueDate"
    ).value =
        task.dueDate
            ? String(
                task.dueDate
              ).substring(0,10)
            : "";


    document.getElementById(
        "taskAssignedTo"
    ).value =
        task.assignedTo || "";


    document.getElementById(
        "taskModal"
    ).style.display =
        "flex";

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    document.getElementById(
        "taskModal"
    ).style.display =
        "none";


    editingTaskId =
        null;

}


/* =========================================================
   SAVE TASK
========================================================= */

document
    .getElementById("taskForm")
    .addEventListener(
        "submit",
        async function(event){

            event.preventDefault();


            const name =
                document
                    .getElementById(
                        "taskName"
                    )
                    .value
                    .trim();


            const description =
                document
                    .getElementById(
                        "taskDescription"
                    )
                    .value
                    .trim();


            const status =
                document.getElementById(
                    "taskStatus"
                ).value;


            const priority =
                document.getElementById(
                    "taskPriority"
                ).value;


            const dueDate =
                document.getElementById(
                    "taskDueDate"
                ).value;


            const assignedTo =
                document.getElementById(
                    "taskAssignedTo"
                ).value
                .trim();


            if(!name){

                alert(
                    "Task name is required."
                );

                return;

            }


            try{

                let response;


                const payload = {

                    name,

                    description,

                    status,

                    priority,

                    dueDate,

                    assignedTo,

                    projectId,

                    ownerId:
                        user.id

                };


                if(editingTaskId){

                    response =
                        await fetch(
                            `/api/tasks/${editingTaskId}`,
                            {
                                method:"PUT",

                                headers:{
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        payload
                                    )
                            }
                        );

                }else{

                    response =
                        await fetch(
                            "/api/tasks",
                            {
                                method:"POST",

                                headers:{
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(
                                        payload
                                    )
                            }
                        );

                }


                const result =
                    await response
                        .json()
                        .catch(
                            () => ({})
                        );


                if(!response.ok){

                    alert(
                        result.message ||
                        "Unable to save task."
                    );

                    return;

                }


                closeModal();


                await loadProject();


            }catch(error){

                console.error(error);

                alert(
                    "Something went wrong while saving the task."
                );

            }

        }
    );


/* =========================================================
   DELETE TASK
========================================================= */

async function deleteTask(
    taskId
){

    if(
        !confirm(
            "Are you sure you want to delete this task?"
        )
    ){

        return;

    }


    try{

        const response =
            await fetch(
                `/api/tasks/${taskId}`,
                {
                    method:"DELETE"
                }
            );


        const result =
            await response
                .json()
                .catch(
                    () => ({})
                );


        if(!response.ok){

            alert(
                result.message ||
                "Unable to delete task."
            );

            return;

        }


        await loadProject();


    }catch(error){

        console.error(error);

        alert(
            "Unable to delete task."
        );

    }

}


/* =========================================================
   ADD COMMENT
========================================================= */

async function addComment(
    taskId
){

    const input =
        document.getElementById(
            `comment-${taskId}`
        );


    if(!input){
        return;
    }


    const text =
        input.value.trim();


    if(!text){

        alert(
            "Please write a comment."
        );

        return;

    }


    try{

        const response =
            await fetch(
                "/api/comments",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            text,

                            taskId,

                            userId:

            );

                .catch(
                    () => ({})
                );


        if(!response.ok){

            alert(

            );

        }

}


/* =========================================================
   DELETE COMMENT
========================================================= */

async function deleteComment(
    commentId
){

    if(
        !confirm(
            "Are you sure you want to delete this comment?"
        )
    ){

        return;

    }


    try{

        const response =
            await fetch(
                `/api/comments/${commentId}`,
                {
                    method:"DELETE"
                }
            );


        const result =
            await response
                .json()
                .catch(
                    () => ({})
                );


        if(!response.ok){

            alert(
                result.message ||
                "Unable to delete comment."
            );

            return;

        }


        await loadProject();


    }catch(error){

        console.error(error);

        alert(
            "Unable to delete comment."
        );

    }

}
